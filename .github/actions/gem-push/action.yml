name: Gem Push
description: Signs the built gem with Sigstore and pushes it to RubyGems with the attestation; a failed signing stops the push

runs:
  using: composite
  steps:
    - name: Configure trusted publishing credentials
      uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

    - name: Sign and push the gem
      shell: bash
      run: |
        gem_file=$("$GITHUB_ACTION_PATH/../../../bin/single_gem")

        "$GITHUB_ACTION_PATH/../../../bin/sigstore" sign "$gem_file" --bundle "$gem_file.sigstore.json"
        gem push "$gem_file" --attestation "$gem_file.sigstore.json"
